<div class="player-profile">
    <!-- Sektion 1: Header mit Bild & Name -->
    <div class="player-header">
        <div class="player-info">
            <h1>Martin 'mad'</h1>
            <p class="subtext">Mitglied • Seit 2007</p>
        </div>
        <img alt="Martin 'mad'" class="player-image-rect" src="../assets/players/dummy.png">
    </div>

    <!-- Sektion 2: Mini-Honors-Tabelle -->
    <table class="standard-table">
        <tr>
            <td>Jahresoskar</td>
            <td><span class="emoji">🌟</span> 2</td>
        </tr>
        <tr>
            <td>Monatsoskar</td>
            <td><span class="emoji">🥇</span> 4</td>
        </tr>
        <!-- Optional: weitere Zeilen -->
    </table>

    <!-- Sektion 3: Aufklappbare Statistiken -->
    <div class="standard-table">
        <div class="toggle-header" onclick="toggleBox(this)">Best of</div>
        <div class="toggle-content">
            <p>[Tabelle mit Jahresdaten]</p>
        </div>
    </div>
    <div class="standard-table">
        <div class="toggle-header" onclick="toggleBox(this)">Jahresstatistik 2025</div>
        <div class="toggle-content">
            <p>[Tabelle mit Jahresdaten]</p>
        </div>
    </div>
    <div class="toggle-box">
        <div class="toggle-header" onclick="toggleBox(this)">Monatsstatistik Juli</div>
        <div class="toggle-content">
            <p>[Tabelle mit Monatsdaten]</p>
        </div>
    </div>
    <div class="toggle-box">
        <div class="toggle-header" onclick="toggleBox(this)">Alle Spiele</div>
        <div class="toggle-content">
            <p>[Tabelle aller Spiele mit Gegner, Datum, Avg usw.]</p>
        </div>
    </div>
</div>

<script>
    function toggleBox(header) {
        header.classList.toggle('open');
        const content = header.nextElementSibling;
        content.style.display = content.style.display === 'block' ? 'none' : 'block';
    }
</script>
