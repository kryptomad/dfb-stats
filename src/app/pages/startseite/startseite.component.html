<h2 id="naechster-abend">Nächster Abend</h2>
<p-card class="grid gap-4 grid-cols-1 sm:grid-cols-1">
  <div class="card-content">
    <div class="card-info">
      <div class="label">Gastgeber</div>
      <div class="profile-row">
        <p-chip
          [label]="gastgeber()"
          [image]="'assets/players/' + image()"
          alt="Avatar image"
          class="profile-chip"
        />
      </div>
      <div class="label">Wann</div>
      <div class="date-time">{{ datum() }}<br>um {{ zeit() }}</div>
      <div class="label">Modus</div>
      <div class="icons">
        <i class="fa fa-coins" [ngClass]="{ inactive: gelddarten() }"></i>
        <i
          class="fa fa-trophy ml-5"
          [ngClass]="{ inactive: oskardarten() }"
        ></i>
      </div>
    </div>
    <div class="card-bgimg">
      <img
        ngSrc="assets/locations/{{ location() }}"
        alt="Spielort"
        height="749"
        width="526"
        priority
      />
      <div class="gradient"></div>
    </div>
  </div>
</p-card>

<h2 id="highlights-letzter-spieltag">Highlights letzter Spieltag</h2>
<div class="stats-cards grid gap-4 grid-cols-2 sm:grid-cols-3">
  <p-card
    *ngFor="let lastStat of lastStats()"
    [header]="lastStat.kategorie">
    <div>
      <span class="card-value">{{ lastStat.wert }}</span>
      <div class="card-names">
        {{ lastStat.spieler.join(', ') }}
      </div>
    </div>
  </p-card>
</div>

<h2 id="naechster-oskarabend">Nächster Oskarabend</h2>
<div class="mb-4">
  Saison:
  <span class="text-primary">{{ season() }}</span>
  – Spieltag:
  <span class="text-primary">{{ matchday() }}</span>
</div>

<div *ngIf="games() && !boardA()" class="grid grid-cols-1 gap-3">
  <p-card *ngFor="let game of games()">
    <div class="oskar-game-grid">
      <div class="player1-avatar">
        <p-avatar [image]="getPlayerImage(game.player1)" size="large" shape="circle"></p-avatar>
      </div>
      <div class="player1-name">
        <span class="text-base font-semibold">{{ game.player1 }}</span>
      </div>
      <div class="vs-column">
        <div class="vs-badge">VS</div>
      </div>
      <div class="player2-name">
        <span class="text-base font-semibold">{{ game.player2 }}</span>
      </div>
      <div class="player2-avatar">
        <p-avatar [image]="getPlayerImage(game.player2)" size="large" shape="circle"></p-avatar>
      </div>
      <div class="schreiber-column">
        <i class="fa-solid fa-beer text-gray-400 text-sm"></i>
        <span class="text-xs text-gray-500">{{ game.writer }}</span>
      </div>
    </div>
  </p-card>
</div>
