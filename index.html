<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <link href="css/components.css" rel="stylesheet"/>
    <link href="css/layout.css" rel="stylesheet"/>
    <link href="css/variables.css" rel="stylesheet"/>
    <link href="css/utilities.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <title>DFB Stats</title>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/default.js"></script>
    <script>
        document.onreadystatechange = () => loadTemplate('default.html');
    </script>
</head>
<body>
<div class="container">
    <div class="content" id="content">

    </div>
    <div class="footer">
        <img alt="Borchen Logo" src="assets/logo.svg">
        <button onclick="toggleMenu()">
            <i class="fas fa-bars"></i>
        </button>
        <div class="menu-popup">
            <a onclick="loadTemplate('default.html') && toggleMenu()">
                <i class="fas fa-home"></i>
                <span>Start</span>
            </a>
            <a onclick="loadTemplate('rekorde.html') && toggleMenu()">
                <i class="fas fa-trophy"></i>
                <span>Rekorde</span>
            </a>
            <a onclick="loadTemplate('statistiken.html') && toggleMenu()">
                <i class="fas fa-chart-bar"></i>
                <span>Statistiken</span>
            </a>
            <a onclick="loadTemplate('spieler.html') && toggleMenu()">
                <i class="fas fa-user"></i>
                <span>Spieler</span>
            </a>
            <a onclick="loadTemplate('spiele.html') && toggleMenu()">
                <i class="fas fa-bullseye"></i>
                <span>Spiele</span>
            </a>
            <a onclick="loadTemplate('spieltag.html') && toggleMenu()">
                <i class="fas fa-calendar-alt"></i>
                <span>Spieltag</span>
            </a>
        </div>
    </div>
</div>
</body>
</html>
